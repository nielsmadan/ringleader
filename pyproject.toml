[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ringleader"
version = "0.2.0"
description = "Curate dormant agent sessions on disk — name, classify, triage, and prune them before the GC clock deletes them."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["textual>=8"]
license = "MIT"
authors = [{ name = "Niels Madan" }]

[project.optional-dependencies]
embed = ["model2vec>=0.4"]

[project.scripts]
rl = "ringleader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=1.4.0",
    "pyte>=0.8.2",
    "pexpect>=4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["ringleader"]
# staged by `just vendor` and gitignored, so hatchling drops them
# from the wheel unless they are declared here
artifacts = ["ringleader/_vendor/**"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "ringleader/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ringleader"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["ringleader"]
strict = true

# `llm` is an optional engine (see docs/tech/models.md); it is deliberately not a
# dependency, so its absence must not fail the type check.
[[tool.mypy.overrides]]
module = "llm"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "model2vec",
    "model2vec.*",
    "numpy",
    "numpy.*",
    "tokenizers",
    "tokenizers.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["ringleader", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
# Explicit rule families on top of ruff's defaults (extend-select). Honors the
# in-tree `# noqa` codes (PLC0415, BLE001, SLF001, ...).
extend-select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60
max-args = 6
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]
"tests/*" = ["S101", "SLF001", "PLR2004", "E402", "PLC0415"]
# JSON shape violations stay ValueError: the caller skips the file on that type.
"ringleader/commands/hooks.py" = ["TRY004"]
