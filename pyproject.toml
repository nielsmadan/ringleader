[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ringleader"
version = "0.1.0"
description = "Curate dormant Claude Code sessions on disk — name, classify, triage, and prune them before the GC clock deletes them."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
license = "MIT"
authors = [{ name = "Niels Madan" }]

[project.optional-dependencies]
api = ["llm"]

[project.scripts]
rl = "ringleader.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["ringleader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["ringleader"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["ringleader", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60
max-args = 6
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]
"tests/*" = ["S101", "SLF001", "PLR2004", "E402", "PLC0415"]
