name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish (for example, v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: release-source
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: nielsmadan/curtaincall@v1.2.0
      - name: Validate the annotated tag and its ancestry
        id: identity
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release retries must run from main" >&2
              exit 1
            fi
            RELEASE_COMMIT=$(curtains ci validate-tag "$RELEASE_TAG")
          else
            RELEASE_COMMIT=$(curtains ci validate-tag "$RELEASE_TAG" "$GITHUB_SHA")
          fi
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check out the exact release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.release-commit }}
          path: release-source
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          version: '0.13.4'
          working-directory: release-source
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Tag matches the pyproject version
        run: uv run python scripts/release.py check-tag "$RELEASE_TAG"
      # strict, unlike `just vendor`: a release wheel without the presence binaries must fail here
      - name: Vendor hooklinesinker
        run: uv run python scripts/hooklinesinker.py vendor
      - run: just check
      - run: uv build --wheel --out-dir dist
      - name: Assemble release assets and notes
        run: |
          BUNDLE="$RUNNER_TEMP/release-bundle"
          uv run python scripts/release.py assets --dist dist --out "$BUNDLE/assets"
          uvx git-cliff@2.13.1 --config cliff.toml --current --strip all \
            -o "$BUNDLE/release-notes.md"
          test -s "$BUNDLE/release-notes.md"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: nielsmadan/curtaincall@v1.2.0
      - name: Revalidate the release commit
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
        run: |
          test "$(curtains ci validate-tag "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: release-bundle
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
        run: |
          curtains ci publish "$RELEASE_TAG" "$RELEASE_COMMIT" \
            --notes release-bundle/release-notes.md release-bundle/assets/*
